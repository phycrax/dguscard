[package]
name = "dguscard-driver"
version = "0.1.0"
edition = "2024"
description = "TODO"
license = "MIT OR Apache-2.0"
repository = "https://github.com/phycrax/dguscard"
keywords = ["dwin", "dgus"]
categories = ["embedded", "no-std"]

[features]
default = []
## Use [`defmt`](https://docs.rs/defmt/latest/defmt/) for logging
defmt = [
    "dep:defmt",
    "dguscard/defmt",
    "embedded-io-async/defmt",
]

[dependencies]
dguscard          = { path = "../dguscard" }
embedded-io-async = "0.7"
embassy-sync      = { git = "https://github.com/embassy-rs/embassy", rev = "508d54ea3244d5266c82198cfcf31ce53e13a15b" }
serde             = { workspace = true }
defmt             = { workspace = true, optional = true }
