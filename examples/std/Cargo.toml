[package]
name = "std"
version = "0.1.0"
edition = "2024"

[dependencies]
embassy-executor        = { version = "0.10.0", features = ["executor-thread", "platform-std"] }
embassy-futures         = { version = "0.1.2" }
embassy-sync            = { version = "0.8.0" }

dguscard-driver         = { path = "../../dguscard-driver" }

embedded-io-async       = { version = "0.7", features = ["std"] }
critical-section        = { version = "1.2", features = ["std"] }
static_cell             = { version = "2.1.1" }
serde                   = { version = "1", default-features = false, features = ["derive"] }

serialport              = { version = "4.9.0" }
